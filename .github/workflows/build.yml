name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish pannello server
        run: dotnet publish src/DaProd.ServerPanel -c Release -o out/DaProdServer
      - name: Publish launcher
        run: dotnet publish src/DaProd.Launcher -c Release -o out/DaProdLauncher
      - uses: actions/upload-artifact@v4
        with:
          name: DaProdArcheage
          path: |
            out/DaProdServer/DaProdServer.exe
            out/DaProdLauncher/DaProdLauncher.exe
